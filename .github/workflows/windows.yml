name: Windows Package & Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --dev
      - name: Build Windows package
        run: uv run --no-sync python scripts/build.py
      - name: Verify packaged CLI
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'yanxi-package-check'
          & './dist/yanxi/yanxi-cli.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI help failed' }
          & './dist/yanxi/yanxi-cli.exe' --list-providers
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI provider list failed' }
          Get-FileHash './dist/*.zip' -Algorithm SHA256 | Format-List
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: yanxi-windows-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 6
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --dev
      - name: Test with process timeout
        timeout-minutes: 3
        shell: pwsh
        run: |
          $testScript = @'
          import ctypes
          import subprocess
          import sys

          # 子进程继承此设置，原生异常直接退出并记录日志，避免无桌面的 CI 等待错误对话框。
          ctypes.windll.kernel32.SetErrorMode(0x8003)
          with open('ci-tests.log', 'w', encoding='utf-8') as log:
              result = subprocess.run(
                  [sys.executable, '-m', 'pytest', '-vv', '-o', 'faulthandler_timeout=45', 'tests', '--tb=short'],
                  stdout=log, stderr=subprocess.STDOUT, timeout=90,
              )
          sys.exit(result.returncode)
          '@
          uv run --no-sync python -c $testScript
          exit $LASTEXITCODE
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yanxi-test-log-${{ github.sha }}
          path: ci-tests.log
          if-no-files-found: warn
          retention-days: 14
