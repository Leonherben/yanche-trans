<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="v3_bg_b" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#161821"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <linearGradient id="v3_rim_b" x1="60" y1="40" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
    <!-- 小径光带渐变：自暗处延伸向光明 (深紫 -> 蔚蓝 -> 极光冷青) -->
    <linearGradient id="v3_path_grad" x1="140" y1="360" x2="370" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- 左侧幽径立面，右侧开阔台阶 -->
    <linearGradient id="v3_pillar_l" x1="160" y1="170" x2="230" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2d3142"/>
      <stop offset="100%" stop-color="#171922"/>
    </linearGradient>
    <linearGradient id="v3_pillar_r" x1="280" y1="170" x2="350" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b4259"/>
      <stop offset="100%" stop-color="#1f232f"/>
    </linearGradient>
  </defs>

  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#v3_bg_b)"/>
  <rect x="36.75" y="36.75" width="438.5" height="438.5" rx="103.25" stroke="url(#v3_rim_b)" stroke-width="1.5"/>

  <!-- 抽象现代几何建筑：两侧立面夹持出一条通透幽远的光之蹊径 (下自成蹊) -->
  <g transform="translate(0, 0)">
    <!-- 左立柱面 -->
    <path d="M165 175 C165 160 178 150 192 154 L225 164 C235 167 242 176 242 187 L242 325 C242 340 229 350 215 346 L182 336 C172 333 165 324 165 313 Z" 
          fill="url(#v3_pillar_l)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- 右立柱面 -->
    <path d="M347 337 C347 352 334 362 320 358 L287 348 C277 345 270 336 270 325 L270 187 C270 172 283 162 297 166 L330 176 C340 179 347 188 347 199 Z" 
          fill="url(#v3_pillar_r)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- 中心贯穿的流光折跃小径 (The Path) -->
    <path d="M145 340 Q256 310 256 256 T367 172" 
          stroke="url(#v3_path_grad)" stroke-width="14" stroke-linecap="round"/>
    <!-- 小径核心光核 (顿悟微光) -->
    <circle cx="256" cy="256" r="6" fill="#ffffff"/>
  </g>
</svg>